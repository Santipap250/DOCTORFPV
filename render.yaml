# render.yaml — OBIXConfig Doctor v5.2
# Render Blueprint configuration for automatic deployment
services:
  - type: web
    name: configdoctor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60 --preload --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: FORCE_INSECURE
        value: "0"
      - key: COMMUNITY_DB_PATH
        value: /var/data/community.db
      - key: PYTHON_VERSION
        value: "3.11.0"
    healthCheckPath: /healthz
    autoDeploy: true
